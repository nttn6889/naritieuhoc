<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bé 4–6 tuổi làm quen 29 chữ cái tiếng Việt, đọc theo âm như sách Tiếng Việt 1 (a, bờ, cờ…): bảng chữ kèm tranh, nghe âm chọn chữ, tranh có âm gì, tìm chữ.">
<title>Chữ cái theo âm · Nari Tiểu Học</title>
<link rel="icon" href="../logo/nari-tieu-hoc-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../logo/nari-tieu-hoc-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Bài chữ cái kiểu sách tranh: thẻ to, nút to cho ngón tay bé. Cam = nguyên âm, xanh = phụ âm (chỉ ở phần Làm quen);
   trong trò chơi chữ in cùng một màu mực để bé nhìn hình dáng chữ, không nhìn màu. Chủ ý chỉ có một giao diện sáng. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#EEF5FF; --card:#FFFFFF; --ink:#22304D; --soft:#5B6B8C; --line:#D5E1F5;
  --vow:#F07A35; --vow-bg:#FFE9DB; --vow-ink:#9A3F0C; --con:#2E7BE0; --con-bg:#DDEBFF; --con-ink:#1C4F96;
  --good:#22A866; --good-bg:#DDF6E8; --bad:#E04A5F; --star:#F5B700;
  --f-big:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--con);outline-offset:3px}
h1,h2,h3{font-family:var(--f-big);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

/* đầu trang */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 2px 0 var(--line);text-decoration:none;color:inherit}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.pill .st{color:var(--star);font-size:22px;line-height:1}
.snd{border:0}
.snd[aria-pressed="false"]{opacity:.55}

/* trang đầu */
.hero{background:var(--card);border-radius:28px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 4px 0 var(--line)}
.hero h1{font-size:clamp(28px,7vw,40px)}
.hero .sub{color:var(--soft);font-weight:700}
.abc{display:flex;gap:8px;justify-content:center;margin-bottom:4px}
.abc span{width:clamp(62px,18vw,84px);aspect-ratio:1;border-radius:22px;display:grid;place-items:center;font:800 clamp(44px,13vw,60px)/1 var(--f-big);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.abc span:nth-child(1){background:var(--vow);transform:rotate(-6deg)}
.abc span:nth-child(2){background:var(--con);transform:translateY(-6px)}
.abc span:nth-child(3){background:var(--good);transform:rotate(6deg)}
.groups{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.groups .lab{font-weight:800;font-size:15px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;font-size:16px;line-height:1.2}
.chip b{font-family:var(--f-big);font-size:19px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tile{border:0;background:var(--card);border-radius:22px;padding:16px;text-align:left;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-big);font-weight:800;font-size:26px}
.tile h3{font-size:21px}
.tile p{color:var(--soft);font-size:14px;font-weight:700;line-height:1.3}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:800}
.mom{background:var(--card);border-radius:22px;padding:16px 18px;border:2px dashed var(--line)}
.mom h2{font-size:20px;margin-bottom:6px}
.mom ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* khung hoạt động */
.panel{background:var(--card);border-radius:26px;padding:18px 16px 20px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.panel h2{font-size:clamp(24px,6vw,32px)}
.ask{font-size:clamp(18px,4.6vw,22px);font-weight:800}
.hint{color:var(--soft);font-weight:700;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;background:var(--ink);color:#fff;box-shadow:0 3px 0 #0e1628}
.btn.light{background:var(--bg);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:none}
.prog{font-weight:800;color:var(--soft)}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--star)}

/* làm quen: thẻ chữ */
.card{width:100%;border-radius:24px;padding:16px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.card.v{background:var(--vow-bg)} .card.c{background:var(--con-bg)}
@media (max-width:420px){.card{grid-template-columns:minmax(0,1fr)}}
.card .big{border:0;background:var(--card);border-radius:22px;padding:6px 10px 10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.card .big .l{font:800 clamp(110px,32vw,150px)/1 var(--f-big)}
.card.v .big .l{color:var(--vow)} .card.c .big .l{color:var(--con)}
.card .big small{font-weight:800;color:var(--soft);font-size:14px}
.card .info{display:flex;flex-direction:column;gap:8px;align-items:center}
.reads{font-weight:800;font-size:18px}
.reads b{font-family:var(--f-big);font-size:30px;line-height:1;padding:0 4px}
.card.v .reads b{color:var(--vow-ink)} .card.c .reads b{color:var(--con-ink)}
.pic{border:0;background:var(--card);border-radius:22px;padding:8px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.pic .e{font-size:64px;line-height:1.1}
.word{font:800 30px/1.1 var(--f-big);letter-spacing:.02em}
.word mark{background:none;color:inherit;padding:0 1px;text-decoration:underline 4px;text-underline-offset:5px}
.card.v .word mark{color:var(--vow)} .card.c .word mark{color:var(--con)}
.kind{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--card)}
.card.v .kind{color:var(--vow-ink)} .card.c .kind{color:var(--con-ink)}
.note2{font-size:14px;font-weight:700;color:var(--soft);max-width:34ch}
.nav{display:flex;gap:10px;justify-content:center;align-items:center}
.board-h{font-weight:800;font-size:15px;color:var(--soft);align-self:flex-start;margin-top:4px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;width:100%}
.key{border:0;aspect-ratio:1;border-radius:16px;font:800 32px/1 var(--f-big);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.key.v{background:var(--vow-bg);color:var(--vow-ink)} .key.c{background:var(--con-bg);color:var(--con-ink)}
.key[aria-current="true"]{outline:4px solid var(--star);outline-offset:1px}

/* trò chơi */
.speaker{border:0;width:120px;height:120px;border-radius:50%;background:var(--con-bg);font-size:58px;line-height:1;box-shadow:0 4px 0 var(--line)}
.speaker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice{border:0;width:clamp(86px,25vw,110px);aspect-ratio:1;border-radius:26px;background:var(--bg);box-shadow:0 4px 0 var(--line);font:800 clamp(56px,16vw,72px)/1 var(--f-big)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice.ok{background:var(--good-bg);color:var(--good);box-shadow:0 4px 0 #b5e7cc}
.choice.no{background:#FFE3E7;color:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.bigpic{border:0;background:var(--bg);border-radius:26px;padding:10px 26px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigpic .e{font-size:88px;line-height:1.1}
.bigpic .word{font-size:38px}
.slot{display:inline-block;min-width:.75em;border:3px dashed var(--star);border-radius:10px;background:#FFF8DC;color:transparent;line-height:1;padding:0 2px;animation:pulse 1.2s infinite}
.slot.fill{border-color:transparent;background:var(--good-bg);color:var(--good);animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:440px}
.cell{border:0;aspect-ratio:1;border-radius:20px;background:var(--bg);box-shadow:0 3px 0 var(--line);font:800 clamp(40px,12vw,60px)/1 var(--f-big);display:grid;place-items:center;position:relative}
.cell.ok{background:var(--good-bg);color:var(--good);box-shadow:0 3px 0 #b5e7cc}
.cell.ok::after{content:"✓";position:absolute;top:4px;right:9px;font-size:18px;font-family:var(--f-body)}
.cell.no{background:#FFE3E7;color:var(--bad)}
.target{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:14px;background:var(--ink);color:#fff;font:800 1.5em/1 var(--f-big);vertical-align:middle;margin:0 4px}

/* chúc mừng */
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(34,48,77,.45);z-index:20;padding:20px}
.win .box{background:var(--card);border-radius:30px;padding:24px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .35s}
.win .bigstar{font-size:84px;line-height:1;color:var(--star)}
.win h2{font-size:32px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:21;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.note{font-size:14px;color:var(--soft);font-weight:700;text-align:center}
/* bài từng chữ */
.lhead{display:flex;align-items:center;gap:12px;justify-content:center}
.lbadge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font:800 46px/1 var(--f-big);color:#fff}
.lbadge.v{background:var(--vow)} .lbadge.c{background:var(--con)}
.stepper{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stepper span{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--soft)}
.stepper span.on{background:var(--ink);color:#fff}
.stepper span.ok{background:var(--good-bg);color:var(--good)}
.shape{background:#FFF8DC;border-radius:16px;padding:8px 14px;font-weight:800;max-width:36ch}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.words .pic{min-width:0;padding:8px 4px 10px}
.words .pic .e{font-size:clamp(44px,13vw,60px)}
.words .word{font-size:clamp(18px,5.4vw,26px)}
.pic.heard{outline:3px solid var(--good)}
.pic.say{outline:4px solid var(--star);transform:scale(1.04)}
.pic.ok{background:var(--good-bg)}
.pic.no{background:#FFE3E7}
.wv mark{color:var(--vow)} .wc mark{color:var(--con)}
.keys2{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;width:100%}
.key{position:relative}
.key.done::after{content:"✓";position:absolute;top:1px;right:5px;font:800 14px/1 var(--f-body);color:var(--good)}

/* đánh vần */
.spell{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.spell button{border:0;border-radius:20px;min-width:72px;height:84px;padding:0 12px;font:800 54px/1 var(--f-big);box-shadow:0 3px 0 var(--line)}
.spell .sc{background:var(--con-bg);color:var(--con-ink)}
.spell .sv{background:var(--vow-bg);color:var(--vow-ink)}
.spell .sr{background:var(--ink);color:#fff;min-width:110px}
.spell .op{font:800 34px/1 var(--f-big);color:var(--soft)}
.spell .hi{outline:4px solid var(--star);outline-offset:2px}
.spellread{font-weight:800;font-size:19px}
.spellread b{font-family:var(--f-big);font-size:24px}
.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:440px}
.tone{border:0;border-radius:18px;background:var(--bg);box-shadow:0 3px 0 var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tone b{font:800 34px/1.1 var(--f-big)}
.tone small{font-weight:800;font-size:13px;color:var(--soft)}
.tone i{font-style:normal;font-size:26px;line-height:1.1;min-height:28px}
.tone[aria-pressed="true"]{background:#FFF8DC;outline:3px solid var(--star)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.tiles .tl{border:0;width:54px;height:58px;border-radius:16px;font:800 30px/1 var(--f-big);box-shadow:0 3px 0 var(--line)}
.tiles.c .tl{background:var(--con-bg);color:var(--con-ink)}
.tiles.v .tl{background:var(--vow-bg);color:var(--vow-ink)}
.tiles .tl[aria-pressed="true"]{background:var(--ink);color:#fff}
.tiles .tl:disabled{opacity:.3}
.rowlab{font-weight:800;font-size:15px;color:var(--soft);align-self:flex-start}
.sent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{border:0;background:var(--bg);border-radius:14px;padding:6px 12px;font:800 clamp(28px,8vw,38px)/1.2 var(--f-big);box-shadow:0 3px 0 var(--line)}
.sw.say{background:#FFF8DC;outline:3px solid var(--star)}
.wv .sw mark,.wv .word mark{color:var(--vow)} .wc .sw mark,.wc .word mark{color:var(--con)}
.sw mark{background:none;color:inherit;text-decoration:underline 4px;text-underline-offset:5px}
.pic .sp{font-weight:700;font-size:12px;color:var(--soft);line-height:1.35}
.bigpic .word mark{background:none;text-decoration:underline 4px;text-underline-offset:6px}
.bigpic .e.multi{font-size:clamp(44px,14vw,72px);white-space:nowrap}
.rule2{background:#FFF8DC;border-radius:16px;padding:8px 14px;font-weight:800;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="all" href="../">‹ Tất cả bài</a>
    <button class="back" id="back" hidden>‹ Trang đầu</button>
    <span class="sp"></span>
    <span class="pill" title="Số sao bé đã có"><span class="st">★</span><span id="stars">0</span></span>
    <button class="pill snd" id="snd" aria-pressed="true">🔊 Đọc to</button>
  </div>
  <main id="view"></main>
  <p class="note" id="voiceNote" hidden>Máy này chưa có giọng đọc tiếng Việt, mẹ đọc to giúp bé nhé.</p>
</div>

<script>
(function(){
/* ---------- 29 chữ cái: [chữ, âm đọc như sách Tiếng Việt 1, từ có âm đó, tranh, ghi chú cho mẹ] ---------- */
var RAW=[
  ['a','a','áo','👕'],
  ['ă','á','tắm','🛁','Âm ă đọc ngắn như “á”. Chữ a đội mũ ngược (cái mũ hình bát).'],
  ['â','ớ','cây','🌳','Âm â đọc như “ớ”. Chữ a đội mũ nhọn.'],
  ['b','bờ','bò','🐄'],
  ['c','cờ','cá','🐟'],
  ['d','dờ','dê','🐐'],
  ['đ','đờ','đồng hồ','⏰','Chữ đ là chữ d có thêm một gạch ngang.'],
  ['e','e','em bé','👶'],
  ['ê','ê','ếch','🐸','Chữ e đội mũ nhọn thành ê.'],
  ['g','gờ','gà','🐔'],
  ['h','hờ','hoa','🌸'],
  ['i','i','chim','🐦','Đây là i ngắn (có dấu chấm trên đầu).'],
  ['k','ca','kem','🍦','Sách Tiếng Việt 1 đọc chữ k là “ca”. Chữ k chỉ đứng trước e, ê, i.'],
  ['l','lờ','lá','🍃'],
  ['m','mờ','mèo','🐱'],
  ['n','nờ','nho','🍇'],
  ['o','o','ong','🐝'],
  ['ô','ô','cái ô','☂️','Chữ o đội mũ nhọn thành ô.'],
  ['ơ','ơ','ớt','🌶️','Chữ o có thêm cái râu thành ơ.'],
  ['p','pờ','pin','🔋'],
  ['q','cu','quà','🎁','Sách đọc chữ q là “cu”. Chữ q luôn đi cùng u thành qu (đọc “quờ”).'],
  ['r','rờ','rùa','🐢'],
  ['s','sờ','sao','⭐'],
  ['t','tờ','táo','🍎'],
  ['u','u','cú mèo','🦉'],
  ['ư','ư','sư tử','🦁','Chữ u có thêm cái râu thành ư.'],
  ['v','vờ','voi','🐘'],
  ['x','xờ','xe','🚗'],
  ['y','i dài','y tá','👩‍⚕️','Đây là i dài (có đuôi dài, không có chấm).']
];
var VOW='aăâeêioôơuưy';
var L={},ORDER=[];
RAW.forEach(function(r){L[r[0]]={ch:r[0],snd:r[1],word:r[2],pic:r[3],tip:r[4]||'',v:VOW.indexOf(r[0])>=0};ORDER.push(r[0])});
var GROUPS=[
  ['tat-ca','Tất cả',ORDER],
  ['a','a ă â','aăâ'.split('')],
  ['o','o ô ơ','oôơ'.split('')],
  ['e','e ê i y u ư','eêiyuư'.split('')],
  ['b','b c d đ g h','bcdđgh'.split('')],
  ['k','k l m n p q','klmnpq'.split('')],
  ['r','r s t v x','rstvx'.split('')]
];
/* chữ dễ nhầm hình dáng, dùng làm chữ gây nhiễu khi tìm */
var CONF={b:'dpđh',d:'bđqa',đ:'db',p:'qb',q:'pgd',g:'qy',m:'nu',n:'mhu',u:'ưnv',ư:'u',h:'nbk',k:'h',o:'ôơac',ô:'oơ',ơ:'oô',a:'ăâod',ă:'aâ',â:'aă',e:'êc',ê:'e',i:'ly',l:'it',t:'l',y:'gvi',v:'uy',x:'s',s:'x',c:'eo',r:'n'};

var view=document.getElementById('view'), backB=document.getElementById('back');
function $(s,r){return (r||document).querySelector(s)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
/* bỏ dấu thanh (huyền, sắc, hỏi, ngã, nặng), giữ dấu mũ / râu / trăng: “á” → “a”, “ấ” → “â”, “ử” → “ư” */
function base(c){return c.normalize('NFD').replace(/[̣̀́̃̉]/g,'').normalize('NFC').toLowerCase()}
function idxIn(word,ch){var w=Array.from(word);for(var i=0;i<w.length;i++)if(base(w[i])===ch)return i;return -1}
function hasLetter(word,ch){return idxIn(word,ch)>=0}
function wordHTML(word,ch,mode){
  var w=Array.from(word),k=idxIn(word,ch);
  return w.map(function(c,i){
    if(i!==k)return c;
    if(mode==='mark')return '<mark>'+c+'</mark>';
    if(mode==='slot')return '<span class="slot" id="slot">'+c+'</span>';
    return c;
  }).join('');
}

var stars=0; try{stars=+localStorage.getItem('ncc-stars')||0}catch(e){}
var sound=true; try{sound=localStorage.getItem('ncc-snd')!=='0'}catch(e){}
var grp='tat-ca'; try{grp=localStorage.getItem('ncc-grp')||'tat-ca'}catch(e){}
function groupOf(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i][0]===id)return GROUPS[i];return GROUPS[0]}
function pool(){return groupOf(grp)[2]}
function setGrp(id){grp=id;try{localStorage.setItem('ncc-grp',id)}catch(e){}}
function showStars(){$('#stars').textContent=stars}
function addStar(){stars++;try{localStorage.setItem('ncc-stars',stars)}catch(e){}showStars()}
var sndB=$('#snd');
function showSnd(){sndB.setAttribute('aria-pressed',sound?'true':'false');sndB.textContent=sound?'🔊 Đọc to':'🔇 Tắt tiếng'}
sndB.onclick=function(){sound=!sound;try{localStorage.setItem('ncc-snd',sound?'1':'0')}catch(e){}showSnd();if(!sound&&window.speechSynthesis)speechSynthesis.cancel();else say('Đọc to')};
var viVoice=null, voiceChecked=false;
function pickVoice(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices()||[];
  if(!vs.length)return;
  voiceChecked=true;
  viVoice=vs.filter(function(v){return /^vi/i.test(v.lang)})[0]||null;
  $('#voiceNote').hidden=!!viVoice;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
else $('#voiceNote').hidden=false;
function say(t,done){
  if(!sound||!window.speechSynthesis){if(done)setTimeout(done,700);return}
  if(!voiceChecked)pickVoice();
  if(voiceChecked&&!viVoice){if(done)setTimeout(done,700);return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';if(viVoice)u.voice=viVoice;u.rate=.8;u.pitch=1.15;
    if(done){var fired=false;var f=function(){if(!fired){fired=true;done()}};u.onend=f;setTimeout(f,3000)}
    speechSynthesis.speak(u);
  }catch(e){if(done)setTimeout(done,700)}
}

/* chọn chữ gây nhiễu: ưu tiên chữ cùng nhóm, rồi chữ dễ nhầm; bỏ chữ nằm trong từ (nếu có từ) */
/* â và ơ, i và y nghe gần như nhau: không cho đứng cùng nhau trong trò nghe */
var SAME={'â':'ơ','ơ':'â','i':'y','y':'i'};
function distractors(ch,n,word,byEar){
  var P=pool(), out=[];
  function ok(c){return c!==ch&&out.indexOf(c)<0&&L[c]&&!(word&&hasLetter(word,c))&&!(byEar&&SAME[ch]===c)}
  shuffle(P.slice()).forEach(function(c){if(out.length<n&&ok(c))out.push(c)});
  Array.from(CONF[ch]||'').forEach(function(c){if(out.length<n&&ok(c))out.push(c)});
  shuffle(ORDER.slice()).forEach(function(c){if(out.length<n&&ok(c))out.push(c)});
  return out;
}
/* lượt hỏi: lần lượt các chữ trong nhóm, không lặp liền nhau */
function makeRound(n,filter){
  var P=pool().filter(filter||function(){return true}),q=[];
  if(!P.length)P=pool();
  while(q.length<n){var s=shuffle(P.slice());if(q.length&&s[0]===q[q.length-1]&&s.length>1)s.push(s.shift());q=q.concat(s)}
  return q.slice(0,n);
}

    '<p class="ask">Cô đọc âm nào? Bé chạm vào chữ đó.</p>'+

    '<p class="hint">Chạm cái loa để nghe lại.</p>'+
    '<div class="opts">'+opts.map(function(c){return '<button class="choice" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>'+
    '</section>';
  var ask=function(){say(o.snd+'. '+o.snd+'.')};
  say('Bé nghe nhé. '+o.snd+'. '+o.snd+'.');
  $('#spk').onclick=ask;
  var locked=false;

      setTimeout(function(){R2.i++;if(R2.i>=R2.q.length){R2=null;win('Bé nghe đúng hết 5 âm rồi.',listen)}else listen()},1300)}

}

/* ---------- 4. tìm chữ ---------- */
var findQ=[];
function find(){
  if(!findQ.length||findQ.grp!==grp){findQ=makeRound(6);findQ.grp=grp}
  var t=findQ.shift(), o=L[t];
  var others=distractors(t,2).concat();
  /* ưu tiên chữ dễ nhầm hình dáng làm nhiễu trong lưới */
  var cf=Array.from(CONF[t]||'').filter(function(c){return L[c]});
  if(cf.length)others[0]=cf[rnd(cf.length)];
  if(others[1]===others[0])others[1]=distractors(t,3).filter(function(c){return c!==others[0]})[0];
  var k=3+rnd(3), cells=[];
  for(var i=0;i<12;i++)cells.push(i<k?t:others[i%others.length]);
  shuffle(cells);
  var found=0;
  view.innerHTML='<section class="panel"><h2>Tìm chữ</h2>'+
    '<p class="ask">Bé chạm vào tất cả chữ <span class="target">'+t+'</span></p>'+
    '<p class="hint">Chữ '+t+' đọc là “'+o.snd+'”, như trong “'+o.word+'” '+o.pic+'</p>'+
    '<div class="grid">'+cells.map(function(v){return '<button class="cell" data-v="'+v+'">'+v+'</button>'}).join('')+'</div>'+
    '<p class="prog" id="prog">Đã tìm được 0 / '+k+'</p>'+
    '<button class="btn light" id="sayAsk">🔊 Nghe lại</button></section>';
  var ask='Bé tìm tất cả chữ '+o.snd+' nhé. '+o.snd+', như trong '+o.word+'.';
  say(ask);
  $('#sayAsk').onclick=function(){say(ask)};
  view.querySelectorAll('.cell').forEach(function(b){b.onclick=function(){
    if(b.classList.contains('ok'))return;
    var v=b.dataset.v;
    if(v===t){b.classList.add('ok');found++;$('#prog').textContent='Đã tìm được '+found+' / '+k;
      if(found===k)setTimeout(function(){win('Bé tìm đủ '+k+' chữ '+t+'.',find)},300);else say(o.snd)}
    else{b.classList.add('no');shakeEl(b);say('Đây là chữ '+L[v].snd+'. Bé tìm chữ '+o.snd+' nhé.');setTimeout(function(){b.classList.remove('no')},900)}
  }});
}

var ALLW=[],seenW={};

/* âm nghe giống nhau (giọng Bắc của máy): không dùng làm tiếng gây nhiễu trong trò “tai thính” */
var EAR={c:'kq',k:'cq',q:'ck',i:'y',y:'i','â':'ơ','ơ':'â',d:'r',r:'d',s:'x',x:'s',l:'n',n:'l'};
var DONE={}; try{DONE=JSON.parse(localStorage.getItem('ncc-done')||'{}')||{}}catch(e){}

/* ---------- đánh vần: ghép phụ âm + nguyên âm, rồi thêm dấu thanh ---------- */
var TONES=[['ngang','','không dấu'],['huyền','̀','dấu huyền'],['sắc','́','dấu sắc'],['hỏi','̉','dấu hỏi'],['ngã','̃','dấu ngã'],['nặng','̣','dấu nặng']];
function withTone(s,t){if(!t)return s;var a=Array.from(s),last=a.pop();return a.join('')+(last+TONES[t][1]).normalize('NFC')}
/* tiếng có nghĩa, có tranh: hiện dưới ô dấu thanh */
var MEAN={'bà':'👵','bố':'👨','bé':'👶','bò':'🐄','bí':'🎃','bơ':'🥑','cá':'🐟','cờ':'🚩','cú':'🦉','củ':'🥔','dê':'🐐','dừa':'🥥','đá':'🪨','đỏ':'🔴',
  'gà':'🐔','ghế':'🪑','hổ':'🐯','kẹo':'🍬','lá':'🍃','lê':'🍐','lọ':'🏺','mẹ':'👩','mũ':'🧢','mì':'🍜','nơ':'🎀','ô':'☂️','rổ':'🧺',
  'sổ':'📓','tô':'🥣','tủ':'🗄️','vẽ':'🎨','vở':'📒','xe':'🚗','xô':'🪣','quà':'🎁','quả':'🍑','dù':'⛱️','hồ':'🏞️','tê':'🦏','ve':'🦗',
  'bể':'🏊','cổ':'🦒','đu':'🛝','gỗ':'🪵','lư':'','mo':'','rễ':'🌱','sư':'','tre':'🎋','vó':'🐴','đế':'👟','nhà':'🏠','tơ':'🧵','ti vi':'📺'};
var CONS='bcdđghklmnpqrstvx'.split(''), VOWS='aeêioôơuư'.split('');
function combine(c,v){
  var front='eêi'.indexOf(v)>=0, on=c, snd=L[c].snd, note='', vv=v;
  if(c==='c'&&front){on='k';snd='ca';note='Trước e, ê, i mình viết k (đọc “ca”), không viết c.'}
  else if(c==='k'&&!front){on='c';snd='cờ';note='Trước a, o, ô, ơ, u, ư mình viết c (đọc “cờ”), không viết k.'}
  else if(c==='g'&&front){on='gh';snd='gờ';note='Trước e, ê, i mình viết gh (gờ kép), không viết g.'}
  else if(c==='q'){
    if('aeêơi'.indexOf(v)<0)return null;
    on='qu';snd='quờ';note='Chữ q luôn đi với u thành qu (đọc “quờ”).';
    if(v==='i'){vv='y';note+=' Sau qu, âm i viết là y.'}
  }
  return {on:on,snd:snd,v:vv,vs:L[v].snd,syl:on+vv,note:note};
}
/* khung ghép: [b] + [a] = [ba] và hàng 6 dấu thanh */
function spellHTML(r,t,allow){
  return '<div class="spell" aria-live="polite"><button class="sc" id="spC">'+r.on+'</button><span class="op">+</span><button class="sv" id="spV">'+r.v+'</button><span class="op">=</span><button class="sr" id="spR">'+withTone(r.syl,t)+'</button></div>'+
    '<p class="spellread" id="spRead"></p>'+
    (r.note?'<p class="rule2">'+r.note+'</p>':'')+
    '<p class="rowlab">Thêm dấu thanh:</p><div class="tones">'+TONES.map(function(x,i){if(allow&&allow.indexOf(i)<0)return '';var w=withTone(r.syl,i);return '<button class="tone" data-t="'+i+'" aria-pressed="'+(i===t)+'"><b>'+w+'</b><small>'+x[2]+'</small><i>'+(MEAN[w]||'')+'</i></button>'}).join('')+'</div>';
}
function spellRead(r,t){
  var w=withTone(r.syl,t), el=$('#spRead');
  if(el)el.innerHTML=t?'<b>'+r.syl+'</b> – '+TONES[t][0]+' – <b>'+w+'</b>':'<b>'+r.snd+'</b> – <b>'+r.vs+'</b> – <b>'+r.syl+'</b>';
  var hi=function(id){view.querySelectorAll('.spell .hi').forEach(function(x){x.classList.remove('hi')});var e=$(id);if(e)e.classList.add('hi')};
  if(t){hi('#spR');say(r.syl+'. '+TONES[t][0]+'. '+w+'.',function(){hi(null)});return}
  hi('#spC');
  say(r.snd,function(){hi('#spV');say(r.vs,function(){hi('#spR');say(r.syl,function(){hi(null)})})});
}
function bindSpell(r,state,again){
  $('#spC').onclick=function(){say(r.snd)};
  $('#spV').onclick=function(){say(r.vs)};
  $('#spR').onclick=function(){spellRead(r,state.t)};
  view.querySelectorAll('.tone').forEach(function(b){b.onclick=function(){state.t=+b.dataset.t;again(true)}});
}

/* từ có nghĩa (bé đánh vần được) bắt đầu bằng phụ âm đang chọn; từ cùng nguyên âm xếp trước */
function wordsFor(on,v){
  var seen={},out=[];
  BOOK.forEach(function(r){r[3].forEach(function(w){if(!seen[w[0]]){seen[w[0]]=1;out.push(w)}})});
  Object.keys(MEAN).forEach(function(w){if(MEAN[w]&&!seen[w]&&w.indexOf(' ')<0){var p=parseSyl(w);if(p.on&&p.v.length===1){seen[w]=1;out.push([w,MEAN[w]])}}});
  out=out.filter(function(w){return parseSyl(w[0].split(' ')[0]).on===on});
  out.sort(function(a,b){var x=parseSyl(a[0].split(' ')[0]).v===v?0:1,y=parseSyl(b[0].split(' ')[0]).v===v?0:1;return x-y});
  return out.slice(0,6);
}
/* ---------- 5. đánh vần (máy ghép tiếng) ---------- */
var DV={c:'b',v:'a',t:0};
function spellGame(quiet){
  var r=combine(DV.c,DV.v);
  if(!r){DV.v='a';r=combine(DV.c,DV.v)}
  view.innerHTML='<section class="panel"><h2>Đánh vần</h2>'+
    '<p class="hint">Chọn một phụ âm và một nguyên âm. Bé đọc theo: “bờ – a – ba”, rồi thêm dấu: “ba – huyền – bà”.</p>'+
    spellHTML(r,DV.t)+
    (function(){var ws=wordsFor(r.on,r.v);return ws.length?'<p class="rowlab">Từ có nghĩa bắt đầu bằng “'+r.on+'”:</p>'+wordCards(ws):''})()+
    '<p class="rowlab">Phụ âm:</p><div class="tiles c">'+CONS.map(function(c){return '<button class="tl" data-c="'+c+'" aria-pressed="'+(c===DV.c)+'">'+c+'</button>'}).join('')+'</div>'+
    '<p class="rowlab">Nguyên âm:</p><div class="tiles v">'+VOWS.map(function(v){return '<button class="tl" data-v="'+v+'" aria-pressed="'+(v===DV.v)+'"'+(combine(DV.c,v)?'':' disabled')+'>'+v+'</button>'}).join('')+'</div>'+
    '<button class="btn" id="spAgain">🔊 Đánh vần lại</button></section>'+
    '<section class="mom" style="margin-top:16px;text-align:left"><h2>Dạy bé đánh vần thế nào?</h2><ul>'+
    '<li><b>Trước hết, bé đọc chắc âm</b> của vài nguyên âm (a, o, ô, ơ, e, ê, i, u, ư) và vài phụ âm (b, c, m, n…).</li>'+
    '<li><b>Ghép 2 âm:</b> mẹ chỉ từng chữ, bé đọc “bờ – a – ba”, chậm rồi nhanh dần đến khi hai âm dính vào nhau thành “ba”.</li>'+
    '<li><b>Thêm dấu:</b> “ba – huyền – bà”, “ba – sắc – bá”. Học dấu huyền, sắc trước (dễ nghe), rồi nặng, hỏi, ngã.</li>'+
    '<li><b>Gắn với nghĩa:</b> ghép xong hỏi “bà là ai?”, “bò ở đâu?”. Ô dấu thanh nào có tranh là tiếng có nghĩa.</li>'+
    '<li><b>Luật chính tả:</b> trước e, ê, i viết k và gh (ke, ghe); q luôn đi với u (qua). Máy sẽ tự đổi và nhắc bé.</li>'+
    '<li>Vần có âm cuối (an, ăn, ấm…) và chữ ghép (ch, nh, ng…) là phần sau, bé học khi vào lớp 1.</li>'+
    '</ul></section>';
  bindSpell(r,DV,spellGame);
  view.querySelectorAll('.tiles .tl').forEach(function(b){b.onclick=function(){
    if(b.dataset.c){DV.c=b.dataset.c}else{DV.v=b.dataset.v}
    DV.t=0;spellGame();
  }});
  $('#spAgain').onclick=function(){spellRead(r,DV.t)};
  var wl=wordsFor(r.on,r.v);
  view.querySelectorAll('.rw').forEach(function(x){x.onclick=function(){view.querySelectorAll('.rw').forEach(function(y){y.classList.remove('say')});x.classList.add('say');sayWord(wl[+x.dataset.i][0],function(){x.classList.remove('say')})}});
  spellRead(combine(DV.c,DV.v)||r,DV.t);
}

var BK={},BORDER=[];
BOOK.forEach(function(r,i){BK[r[0]]={i:i,tone:r[1],mau:r[2],tu:r[3],cau:r[4],cpic:r[5]};BORDER.push(r[0])});
var LATER={'ă':'Âm ă không đứng một mình sau phụ âm, luôn có âm cuối: ăn, ắt, ăm… Sách dạy ă khi học vần (an, ăn, ân).',
  'â':'Âm â không đứng một mình sau phụ âm, luôn có âm cuối: ấm, cây, mây… Sách dạy â khi học vần (an, ăn, ân).',
  'p':'Chữ p thường đi với h thành ph (phở, phố), hoặc đứng cuối vần (áp, họp). Bé học khi vào lớp 1.'};
/* dấu thanh bé đã học tính tới bài này */
function tonesUpTo(ch){var t=[0],i=BK[ch].i;for(var j=0;j<=i;j++)if(BOOK[j][1])t.push(BOOK[j][1]);return t.sort()}

/* tách tiếng: phụ âm đầu + nguyên âm + dấu thanh */
var TMARK={'̀':1,'́':2,'̉':3,'̃':4,'̣':5};
function parseSyl(s){
  s=s.toLowerCase();var t=0;
  var b=s.normalize('NFD').replace(/[̣̀́̉̃]/g,function(m){t=TMARK[m];return ''}).normalize('NFC');
  var m=b.match(/^(qu|gh|[bcdđghklmnpqrstvx])/), on=m?m[1]:'';
  return {on:on,v:b.slice(on.length),base:b,t:t,syl:s};
}
function onSnd(on){return on==='qu'?'quờ':on==='gh'?'gờ':(L[on]?L[on].snd:on)}
function vSnd(v){return v==='y'?'i':(L[v]?L[v].snd:v)}
/* “bờ – a – ba – huyền – bà” */
function spellParts(s){var p=parseSyl(s),a=[];if(p.on){a.push(onSnd(p.on),vSnd(p.v),p.base)}else a.push(vSnd(p.v));if(p.t)a.push(TONES[p.t][0],p.syl);return a}
function spellWord(w){return w.split(/\s+/).map(function(s){return spellParts(s.replace(/[.,!?]/g,'')).join(' – ')})}
function sayWord(w,done){say(spellWord(w).map(function(x){return x.replace(/ – /g,'. ')}).join('. ')+'. '+w+'.',done)}
function sylR(s){var p=parseSyl(s);return {on:p.on,snd:onSnd(p.on),v:p.v,vs:vSnd(p.v),syl:p.on+p.v,note:'',t:p.t}}
function hlLetter(text,ch){return text.split(' ').map(function(w){return hasLetter(w,ch)?wordHTML(w,ch,'mark'):w}).join(' ')}
function wordCards(list){
  return '<div class="words">'+list.map(function(w,i){return '<button class="pic rw" data-i="'+i+'"><span class="e">'+w[1]+'</span><span class="word">'+w[0]+'</span><small class="sp">'+spellWord(w[0]).join('<br>')+'</small></button>'}).join('')+'</div>';
}

var LS=null;
function lessonSteps(ch){
  var b=BK[ch],s=[['nhan','Nhận biết'],['am','Âm mới']];
  if(b.mau&&parseSyl(b.mau).on||b.tu.length)s.push(['van','Đánh vần']);
  s.push(['tai','Tai thính'],['tim','Tìm chữ']);
  if(b.cau)s.push(['cau','Đọc câu']);
  return s;
}
function nextLetter(ch){return BORDER[(BK[ch].i+1)%BORDER.length]}
function finishLesson(ch){markDone(ch);LS=null;win('Bé học xong bài chữ '+ch+'.',function(){go('bai-'+nextLetter(ch))})}
function lesson(ch,quiet){
  if(!LS||LS.ch!==ch)LS={ch:ch,step:0,tai:0,t:0,pick:null};
  var b=BK[ch],steps=lessonSteps(ch),st=steps[LS.step][0],o=L[ch],k=o.v?'v':'c',last=LS.step===steps.length-1;
  var h='<section class="panel"><div class="lhead"><span class="lbadge '+k+'">'+ch+'</span><h2>Bài '+(b.i+1)+': '+ch.toUpperCase()+' '+ch+'</h2></div>'+
    '<div class="stepper">'+steps.map(function(s,i){return '<span class="'+(i===LS.step?'on':i<LS.step?'ok':'')+'">'+(i+1)+'. '+s[1]+'</span>'}).join('')+'</div>';
  var nextBtn='<div class="row"><button class="btn" id="lNext">'+(last?'Xong bài ★':'Tiếp ›')+'</button></div>';
  var W=WORDS[ch];
  if(st==='nhan'){
    var pic=b.cau?b.cpic:W[0][1], txt=b.cau||W[0][0];
    h+='<button class="bigpic" id="nPic"><span class="e'+(Array.from(pic).length>2?' multi':'')+'">'+pic+'</span><span class="word w'+k+'">'+hlLetter(txt,ch)+'</span></button>'+
      '<p class="hint">Bé nghe cô đọc. Tiếng nào có chữ gạch chân là có âm “'+o.snd+'”.</p>'+
      (b.cau?'<p class="hint">Hết bài, bé sẽ tự đọc được câu này!</p>':'')+nextBtn;
  }else if(st==='am'){
    h+='<div class="card '+k+'"><button class="big" id="bigL" aria-label="Nghe âm '+o.snd+'"><span class="l">'+ch+'</span><small>Chữ in hoa: '+ch.toUpperCase()+'</small></button>'+
      '<div class="info"><span class="kind">'+(o.v?'Nguyên âm':'Phụ âm')+'</span><p class="reads">Đọc là <b>'+o.snd+'</b></p>'+
      '<p class="shape">'+SHAPE[ch]+'</p>'+(o.tip?'<p class="note2">'+o.tip+'</p>':'')+'</div></div>'+
      (b.tone?'<p class="rule2">Bài này học thêm <b>'+TONES[b.tone][2]+'</b>.</p>':'')+
      (LATER[ch]?'<p class="rule2">'+LATER[ch]+'</p>':'')+
      '<div class="words w'+k+'">'+W.map(function(w,i){return '<button class="pic hw" data-i="'+i+'"><span class="e">'+w[1]+'</span><span class="word">'+wordHTML(w[0],ch,'mark')+'</span></button>'}).join('')+'</div>'+nextBtn;
  }else if(st==='van'){
    var r=b.mau&&parseSyl(b.mau).on?sylR(b.mau):null;
    if(r&&!LS.vInit){LS.t=r.t;LS.vInit=1}
    h+=(r?'<p class="ask">Tiếng mẫu</p>'+spellHTML(r,LS.t,tonesUpTo(ch)):'')+
      (b.tu.length?'<p class="ask">Đọc từ ngữ</p><p class="hint">Bé chạm vào tranh, đánh vần theo cô rồi đọc liền.</p>'+wordCards(b.tu):'')+nextBtn;
  }else if(st==='tai'){
    if(!LS.pick||LS.pick.r!==LS.tai){
      var good=W[LS.tai%W.length], bad=shuffle(ALLW.filter(function(w){
        if(hasLetter(w[0],ch))return false;
        var e=EAR[ch]||'';for(var j=0;j<e.length;j++)if(hasLetter(w[0],e[j]))return false;
        return true})).slice(0,2);
      LS.pick={r:LS.tai,good:good[0],opts:shuffle([good].concat(bad))};
    }
    h+=pips(LS.tai,3)+'<p class="ask">Tiếng nào có âm “'+o.snd+'”?</p><p class="hint">Bé nghe cô đọc 3 tiếng, rồi chạm vào tranh có âm “'+o.snd+'”.</p>'+
      '<div class="words">'+LS.pick.opts.map(function(w){return '<button class="pic" data-w="'+w[0]+'"><span class="e">'+w[1]+'</span><span class="word">'+w[0]+'</span></button>'}).join('')+'</div>'+
      '<button class="btn light" id="tAgain">🔊 Nghe lại</button>';
  }else if(st==='tim'){
    var cf=Array.from(CONF[ch]||'').filter(function(c){return L[c]&&c!==ch}), others=[];
    shuffle(cf).forEach(function(c){if(others.length<2)others.push(c)});
    shuffle(ORDER.slice()).forEach(function(c){if(others.length<2&&c!==ch&&others.indexOf(c)<0&&SAME[ch]!==c)others.push(c)});
    var cells=[];for(var i=0;i<12;i++)cells.push(i<4?ch:others[i%2]);shuffle(cells);
    h+='<p class="ask">Bé chạm vào tất cả chữ <span class="target">'+ch+'</span></p><p class="hint">'+SHAPE[ch]+'</p>'+
      '<div class="grid">'+cells.map(function(v){return '<button class="cell" data-v="'+v+'">'+v+'</button>'}).join('')+'</div><p class="prog" id="prog">Đã tìm được 0 / 4</p>';
  }else if(st==='cau'){
    var ws=b.cau.split(' ');
    h+='<div class="bigpic"><span class="e'+(Array.from(b.cpic).length>2?' multi':'')+'">'+b.cpic+'</span></div><p class="ask">Bé đọc câu</p>'+
      '<div class="sent w'+k+'">'+ws.map(function(w,i){return '<button class="sw" data-i="'+i+'">'+(hasLetter(w,ch)?wordHTML(w,ch,'mark'):w)+'</button>'}).join('')+'</div>'+
      '<p class="hint">Chạm từng tiếng để nghe. Bé chỉ tay vào từng tiếng và đọc to.</p>'+
      '<div class="row"><button class="btn light" id="cRead">🔊 Cô đọc mẫu</button></div>'+
      '<div class="mom" style="text-align:left;width:100%"><b>Mẹ hỏi bé (nói theo tranh):</b> Trong tranh có ai, có gì? Ai đang làm gì? Ở nhà mình có giống thế không?</div>'+nextBtn;
  }
  view.innerHTML=h+'</section>';

  var nb=$('#lNext');
  if(nb)nb.onclick=function(){if(last){finishLesson(ch);return}LS.step++;lesson(ch);window.scrollTo(0,0)};
  if(st==='nhan'){
    var t=b.cau||W[0][0];
    $('#nPic').onclick=function(){say(t)};
    if(!quiet)say('Bài chữ '+o.snd+'. Bé nghe nhé. '+t);
  }else if(st==='am'){
    $('#bigL').onclick=function(){say(o.snd+'. '+o.snd+'.')};
    view.querySelectorAll('.hw').forEach(function(x){x.onclick=function(){var w=W[+x.dataset.i][0];x.classList.add('heard');say(w+'. '+w+' có âm '+o.snd+'.')}});
    if(!quiet)say('Âm mới: '+o.snd+'. '+o.snd+'. '+SHAPE[ch]);
  }else if(st==='van'){
    var rr=b.mau&&parseSyl(b.mau).on?sylR(b.mau):null;
    if(rr)bindSpell(rr,LS,function(){lesson(ch,true);spellRead(sylR(b.mau),LS.t)});
    view.querySelectorAll('.rw').forEach(function(x){x.onclick=function(){
      view.querySelectorAll('.rw').forEach(function(y){y.classList.remove('say')});x.classList.add('say','heard');
      sayWord(b.tu[+x.dataset.i][0],function(){x.classList.remove('say')})}});
    if(!quiet){if(rr)say('Mình đánh vần tiếng mẫu nhé.',function(){spellRead(rr,LS.t)});else say('Bé đọc từ ngữ nhé.')}
  }else if(st==='tai'){
    var cards=view.querySelectorAll('.words .pic');
    var readAll=function(){var i=0;(function step(){cards.forEach(function(c){c.classList.remove('say')});if(i>=cards.length)return;
      var c=cards[i++];c.classList.add('say');if(sound&&viVoice)say(c.dataset.w,function(){setTimeout(step,250)});else setTimeout(step,900)})()};
    say('Tiếng nào có âm '+o.snd+'?',readAll);
    $('#tAgain').onclick=readAll;
    var locked=false;
    cards.forEach(function(x){x.onclick=function(){
      if(locked)return;
      if(x.dataset.w===LS.pick.good){locked=true;x.classList.add('ok');say(x.dataset.w+' có âm '+o.snd+'. Đúng rồi!');
        setTimeout(function(){LS.tai++;if(LS.tai>=3)LS.step++;lesson(ch)},1500)}
      else{x.classList.add('no');shakeEl(x);say(x.dataset.w+' không có âm '+o.snd+'.');setTimeout(function(){x.classList.remove('no')},900)}
    }});
  }else if(st==='tim'){
    var found=0;
    say('Bé tìm tất cả chữ '+o.snd+' nhé.');
    view.querySelectorAll('.cell').forEach(function(x){x.onclick=function(){
      if(x.classList.contains('ok'))return;
      if(x.dataset.v===ch){x.classList.add('ok');found++;$('#prog').textContent='Đã tìm được '+found+' / 4';
        if(found===4){say('Giỏi quá!');setTimeout(function(){if(last)finishLesson(ch);else{LS.step++;lesson(ch)}},900)}else say(o.snd)}
      else{x.classList.add('no');shakeEl(x);say('Đây là chữ '+L[x.dataset.v].snd+'.');setTimeout(function(){x.classList.remove('no')},900)}
    }});
  }else if(st==='cau'){
    var btns=view.querySelectorAll('.sw'), ws2=b.cau.split(' ');
    btns.forEach(function(x){x.onclick=function(){sayWord(ws2[+x.dataset.i].replace(/[.,!?]/g,''))}});
    var readSent=function(){var i=0;(function step(){btns.forEach(function(x){x.classList.remove('say')});
      if(i>=btns.length){say(b.cau);return}var x=btns[i++];x.classList.add('say');
      if(sound&&viVoice)say(ws2[i-1].replace(/[.,!?]/g,''),function(){setTimeout(step,200)});else setTimeout(step,800)})()};
    $('#cRead').onclick=readSent;
    if(!quiet)say('Bé đọc câu nhé. Cô đọc mẫu.',readSent);
  }
}

/* ---------- chuyển trang ---------- */
var ROUTES={'lam-quen':learn,'nghe-chon':listen,'tranh':picture,'tim-chu':find,'danh-van':spellGame};
function hashNow(){try{return decodeURIComponent(location.hash.slice(1))}catch(e){return location.hash.slice(1)}}
function go(h){if(hashNow()===h)render();else location.hash=h}
function render(){
  var h=hashNow();
  document.querySelectorAll('.win').forEach(function(w){w.remove()});
  if(h.indexOf('bai-')===0&&L[h.slice(4)]){if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}backB.hidden=false;document.getElementById('all').hidden=true;LS=null;lesson(h.slice(4));window.scrollTo(0,0);return}
  if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}
  backB.hidden=!ROUTES[h];document.getElementById('all').hidden=!!ROUTES[h];
  (ROUTES[h]||home)();
  window.scrollTo(0,0);
}
backB.onclick=function(){go('')};
window.addEventListener('hashchange',render);
showStars();showSnd();render();
})();
</script>
