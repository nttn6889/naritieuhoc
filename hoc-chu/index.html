<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Học chữ theo vở · Nari Tiểu Học</title>
<meta name="description" content="Bé học chữ i và chữ t theo vở: nhận biết chữ, tìm tranh có chữ, luyện đọc với dấu thanh, đọc từ, nối từ với tranh, và tập viết từng nét trên ô li.">
<link rel="icon" href="../logo/nari-tieu-hoc-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../logo/nari-tieu-hoc-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#53468F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Dancing+Script:wght@700&display=swap">
<style>
/* Học chữ theo vở của bé (20/11): mỗi bài một chữ như vở mẹ mua (Bài 1: i, Bài 2: t).
   Bảng viết là ô li: đường kẻ 1 → 5 đếm từ dưới lên, cây bên trái, nhà bên phải làm mốc hướng. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#EEF5FF; --card:#FFFFFF; --ink:#22304D; --soft:#5B6B8C; --line:#D5E1F5;
  --purple:#53468F; --orange:#F07A35; --orange-bg:#FFE9DB; --blue:#2E7BE0; --blue-bg:#DDEBFF;
  --good:#22A866; --good-bg:#DDF6E8; --bad:#E04A5F; --star:#F5B700; --tree:#E6F6E4; --house:#FFF1E2;
  --red:#E03A3A; --gold-bg:#FFF4D6; --pink-bg:#FFE6EE;
  --f-num:"Baloo 2","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Dancing Script",cursive;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--f-num);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.back{border:0;background:var(--card);border-radius:999px;font-weight:800;box-shadow:0 2px 0 var(--line);text-decoration:none;color:inherit}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;font-weight:800;box-shadow:0 2px 0 var(--line);border:0}
.pill .st{color:var(--star);font-size:22px;line-height:1}
.snd[aria-pressed="false"]{opacity:.55}
.top .back,.top .pill{min-width:54px;height:54px;padding:0 14px;font-size:24px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer}
.top .pill{font-size:20px}
.panel{background:var(--card);border-radius:26px;padding:18px 14px 20px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.panel h1{font-size:clamp(26px,6.5vw,36px);color:var(--purple)}
.panel h2{font-size:clamp(24px,6vw,32px)}
.hint{color:var(--soft);font-weight:700;font-size:15px}
.ask{font-size:clamp(18px,4.6vw,22px);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:16px;background:var(--ink);color:#fff;box-shadow:0 3px 0 #0e1628}
.btn.light{background:var(--bg);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:none}
.r{color:var(--red)}
mark{background:none;color:var(--red);padding:0}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.prog{font-weight:800;color:var(--soft)}

/* menu ô to (app cho bé) */
.hero{background:var(--card);border-radius:28px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 4px 0 var(--line)}
.hero .ab{font:800 64px/1 var(--f-num);display:flex;gap:16px}
.hero .sub,.hero h1{display:none}
nav.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
nav.menu .tile:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:700px){nav.menu{grid-template-columns:repeat(3,minmax(0,1fr))}nav.menu .tile:last-child:nth-child(odd){grid-column:auto}}
.menu .tile{border:0;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;min-height:168px;padding:16px 8px 14px;border-radius:28px;box-shadow:0 5px 0 rgba(34,48,77,.13);transition:transform .12s}
.menu .tile .ic{width:88px;height:88px;border-radius:26px;font:800 54px/1 var(--f-num);display:grid;place-items:center;background:rgba(255,255,255,.75)!important}
.menu .tile .ic.e{font-size:48px}
.menu .tile h3{font-size:clamp(21px,5.8vw,27px);line-height:1.1}
.menu .tile .ok{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--star);color:#fff;display:grid;place-items:center;font-size:17px}
.menu .tile.go{transform:scale(.94)}
.hello{border:0;border-radius:50%;width:68px;height:68px;background:var(--ink);color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer}
.hello:active{transform:translateY(3px);box-shadow:none}
.ear{border:0;background:var(--bg);border-radius:50%;width:44px;height:44px;font-size:22px;margin-left:8px;vertical-align:middle;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.mom{background:var(--card);border-radius:22px;padding:16px 18px;border:2px dashed var(--line);text-align:left}
.mom h2{font-size:20px;margin:10px 0 6px}
.mom h3{font-size:18px;margin:10px 0 4px}
.mom ul,.mom ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
details.mom{margin-top:6px;width:100%}
details.mom>summary{cursor:pointer;font-weight:800;color:var(--soft);font-size:15px;list-style:none}
details.mom>summary::-webkit-details-marker{display:none}

/* bài học */
.stepper{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stepper button{border:0;font-size:13px;font-weight:800;border-radius:999px;padding:6px 11px;background:var(--bg);color:var(--soft)}
.stepper button.on{background:var(--ink);color:#fff}
.stepper button.ok{background:var(--good-bg);color:var(--good)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:560px}
.form{border:0;border-radius:20px;padding:8px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.form .g{height:76px;display:grid;place-items:center;font:800 64px/1 var(--f-num);color:var(--red)}
.form .g.h{font:700 66px/1 var(--f-hand)}
.form .g svg{height:76px;width:auto}
.form small{font-size:12px;font-weight:800;color:var(--soft);line-height:1.2}
.form.say{outline:4px solid var(--star)}
.keypic{border:0;background:var(--gold-bg);border-radius:22px;padding:8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 #EED48F}
.keypic .e{font-size:54px;line-height:1}
.keypic b{font:800 26px/1 var(--f-num)}
.rhyme{border:0;background:var(--bg);border-radius:20px;padding:10px 16px;font-weight:800;font-size:clamp(17px,4.6vw,21px);line-height:1.45}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.pic{border:0;background:var(--bg);border-radius:22px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line);position:relative;min-width:0}
.pic .e{font-size:clamp(44px,13vw,60px);line-height:1.1}
.pic .word{font:800 clamp(18px,5.2vw,25px)/1.2 var(--f-num)}
.pic.ok{background:var(--good-bg);box-shadow:0 3px 0 #b5e7cc}
.pic.ok::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--good);font-weight:800;font-size:20px}
.pic.no{background:#FFE3E7}
.pic.say{outline:4px solid var(--star)}
.tbl{border-collapse:separate;border-spacing:3px;margin:0 auto}
.tbl th{font:800 20px/1 var(--f-num);color:var(--purple);padding:4px 0}
.tbl th.tn{color:var(--red);font-size:22px;width:20px}
.tbl td{padding:0}
.tbl button{border:0;width:clamp(30px,8.4vw,58px);height:clamp(40px,10vw,54px);border-radius:10px;background:var(--bg);font:800 clamp(17px,4.8vw,26px)/1 var(--f-num);box-shadow:0 2px 0 var(--line);padding:0}
.tbl button.say{background:#FFF8DC;outline:3px solid var(--star)}
.tbl button.seen{background:var(--good-bg)}
.tbl .nil{display:block;width:clamp(30px,8.4vw,58px);height:clamp(40px,10vw,54px);border-radius:12px;background:repeating-linear-gradient(45deg,#F4F7FC,#F4F7FC 6px,#fff 6px,#fff 12px)}
.tones1 button{width:clamp(46px,13vw,72px);height:clamp(56px,15vw,76px);font-size:clamp(28px,8vw,40px)}
.sents{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.sent{border:0;background:var(--bg);border-radius:18px;padding:10px 14px;font:800 clamp(22px,6vw,30px)/1.2 var(--f-num);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px;justify-content:center}
.sent .e{font-size:34px}
.sent.say{outline:4px solid var(--star)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;width:100%;max-width:440px}
.match button{border:0;min-height:76px;border-radius:20px;background:var(--bg);box-shadow:0 3px 0 var(--line);position:relative}
.match .mw{font:800 clamp(22px,6vw,28px)/1.1 var(--f-num)}
.match .mp{font-size:46px;background:#E9F2FF}
.match button.sel{outline:4px solid var(--blue)}
.match button.ok{background:var(--good-bg);box-shadow:0 3px 0 #b5e7cc}
.match button .n{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;font:800 15px/26px var(--f-num)}
.match button.no{background:#FFE3E7}


/* bảng viết ô li */
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.board{display:flex;align-items:stretch;justify-content:center;gap:6px;width:100%}
.mark{flex:none;width:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:13px;color:var(--soft)}
.mark i{font-style:normal;font-size:30px;line-height:1}
.mark.l{background:var(--tree)} .mark.r{background:var(--house)}
.pad{width:min(100%,250px);aspect-ratio:100/146;background:#fff;border-radius:20px;border:2px solid var(--line);display:block;touch-action:none;flex:0 1 auto;min-width:0}
svg.pad{overflow:visible}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;text-align:left}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:16px;padding:10px 12px;font-weight:700;border:0;width:100%;text-align:left}
.steps li b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:800 16px/1 var(--f-num)}
.steps li.cur{background:#FFF8DC;box-shadow:0 0 0 3px var(--star) inset}
.steps li.cur b{background:var(--star);color:#fff}
.steps li.done b{background:var(--good);color:#fff}
.steps li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%}
.msg{min-height:1.6em;font-weight:800;font-size:17px}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.tip{background:var(--orange-bg);border-radius:16px;padding:10px 14px;font-weight:800;color:#8A3A0E;max-width:520px}

/* ===== trình chiếu (21/11): mỗi trang một việc nhỏ; dọc = biểu tượng các phần ở trên, ngang = menu bên trái ===== */
body.fit{padding-block:10px}
body.fit .wrap{height:calc(100dvh - 20px);max-width:1100px;gap:10px}
body.fit #view{flex:1;min-height:0;display:flex;flex-direction:column}
.deck{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.secs{display:flex;gap:6px;overflow-x:auto;flex:none;padding:2px 2px 6px;scrollbar-width:none}
.secs button{flex:none;border:0;background:var(--card);border-radius:16px;min-width:52px;height:52px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 0 var(--line);padding:0 10px;font-weight:800}
.secs .si{font-size:26px;line-height:1}
.secs .sl{display:none;font-size:15px}
.secs button.on{background:var(--ink);color:#fff}
.secs button.on .sl{display:inline}
.secs .wr{background:var(--gold-bg)}
.stage{flex:1;min-height:0;background:var(--card);border-radius:26px;box-shadow:0 4px 0 var(--line);display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "sl sl" "pv nx";padding:10px 12px 12px;gap:8px}
.sbar{grid-area:bar;height:8px;background:var(--bg);border-radius:9px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:var(--star);border-radius:9px;transition:width .3s}
.slide{grid-area:sl;min-height:0;min-width:0;container-type:size;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav{grid-area:pv;justify-self:start;border:0;width:84px;height:66px;border-radius:22px;font-size:30px;background:var(--bg);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.nav.next{grid-area:nx;justify-self:end;width:120px;background:var(--orange);color:#fff;box-shadow:0 4px 0 #C25A1E}
.nav:active{transform:translateY(3px);box-shadow:none}
.shead{display:flex;align-items:center;gap:8px;justify-content:center;flex:none;min-height:44px}
.shead .q{font:800 clamp(20px,6cqmin,30px)/1.2 var(--f-num)}
.shead .ear{margin:0}
.sbody{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:4cqmin;flex-wrap:wrap}
.sbody.col{flex-direction:column;flex-wrap:nowrap}
.glyph{border:0;border-radius:28px;width:min(70cqw,62cqh);height:min(70cqw,62cqh);display:grid;place-items:center;
  font:800 calc(min(70cqw,62cqh)*.72)/1 var(--f-num);color:var(--red);background:#FFF4C2;box-shadow:0 4px 0 rgba(0,0,0,.08);padding:0}
.glyph.g+.lab{color:#8A6510}
.glyph.h{font-family:var(--f-hand);font-weight:700;background:#EAF6D8}
.glyph.svg{background:#FFE0EA}
.glyph.svg svg{height:88%;width:auto}
.lab{font-weight:800;color:var(--soft);font-size:clamp(18px,6cqmin,28px)}
.keybig{border:0;background:var(--gold-bg);border-radius:28px;padding:3cqmin 6cqmin;display:flex;flex-direction:column;align-items:center;gap:1cqmin;box-shadow:0 4px 0 #EED48F}
.keybig .e{font-size:min(40cqh,44cqw);line-height:1.05}
.keybig b{font:800 min(14cqh,13cqw)/1.1 var(--f-num)}
.rhymebig{border:0;background:var(--bg);border-radius:24px;padding:4cqmin 5cqmin;font-weight:800;font-size:clamp(19px,min(7cqh,6cqw),40px);line-height:1.5}
.pk{--s:min(44cqw,70cqh);width:var(--s);height:calc(var(--s)*1.05);border:0;border-radius:26px;background:var(--bg);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:0}
.pk .e{font-size:calc(var(--s)*.5);line-height:1.05}
.pk .word{font:800 calc(var(--s)*.14)/1.1 var(--f-num)}
@container (orientation:portrait){.pk{--s:min(66cqw,42cqh)}}
.pk.ok,.mpic.ok{background:var(--good-bg);box-shadow:0 4px 0 #b5e7cc}
.pk.ok::after,.mpic.ok::after{content:"✓";position:absolute;top:6px;right:12px;color:var(--good);font:800 26px/1 var(--f-body)}
.pk.no,.mpic.no{background:#FFE3E7}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqmin;width:100%;max-width:min(100%,130cqh)}
.tg button,.tg .nil{border:0;height:min(36cqh,28cqw);border-radius:20px;background:var(--bg);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.tg .nil{box-shadow:none;background:repeating-linear-gradient(45deg,#F4F7FC,#F4F7FC 6px,#fff 6px,#fff 12px)}
.tg small{font:800 min(7cqh,6cqw)/1 var(--f-num);color:var(--red)}
.tg b{font:800 min(17cqh,13cqw)/1 var(--f-num)}
.tg button.say{background:#FFF8DC;outline:4px solid var(--star)}
.tg button.seen{background:var(--good-bg)}
@container (orientation:landscape){.tg{grid-template-columns:repeat(6,1fr);max-width:100%}.tg button,.tg .nil{height:min(56cqh,16cqw)}.tg b{font-size:min(24cqh,8cqw)}.tg small{font-size:min(10cqh,4cqw)}}
.semoji{border:0;background:none;font-size:min(30cqh,34cqw);line-height:1.1;padding:0}
.toks{display:flex;gap:2cqmin;flex-wrap:wrap;justify-content:center}
.tok{border:0;background:var(--bg);border-radius:18px;padding:2cqmin 3cqmin;font:800 min(13cqh,11cqw)/1.1 var(--f-num);box-shadow:0 4px 0 var(--line)}
.mword{border:0;background:var(--bg);border-radius:22px;padding:1cqmin 6cqmin;font:800 min(15cqh,14cqw)/1.2 var(--f-num);box-shadow:0 4px 0 var(--line)}
.mrow{display:flex;gap:4cqmin;justify-content:center}
.mpic{border:0;width:min(28cqw,44cqh);height:min(28cqw,44cqh);border-radius:24px;background:#E9F2FF;box-shadow:0 4px 0 var(--line);font-size:calc(min(28cqw,44cqh)*.6);line-height:1;position:relative;padding:0}
.clouds{display:grid;grid-template-columns:repeat(2,auto);gap:3cqmin 5cqmin;justify-content:center}
@container (orientation:landscape){.clouds{grid-template-columns:repeat(4,auto)}}
.cloud{border:0;background:none;padding:0;position:relative;width:min(42cqw,50cqh);aspect-ratio:3/2;display:grid;place-items:center}
@container (orientation:landscape){.cloud{width:min(22cqw,90cqh)}}
.cloud svg{position:absolute;inset:0;width:100%;height:100%}
.cloud svg path{fill:#fff;stroke:#7F95BD;stroke-width:3;transition:fill .3s}
.cloud span{position:relative;top:12%;font:800 1px/1 var(--f-num);font-size:min(16cqw,19cqh)}
@container (orientation:landscape){.cloud span{font-size:min(9cqw,34cqh)}}
.cloud.no svg path{fill:#FFE3E7}
.bigstar{font-size:min(34cqh,40cqw);line-height:1;color:var(--star)}
.endp{font:800 min(10cqh,9cqw)/1.2 var(--f-num)}
.btn.big{font-size:20px;padding:16px 24px}

.sbody{animation:sin .45s ease-out}
@keyframes sin{from{opacity:0;transform:translateX(24px)}}
.introbig{border:0;background:var(--blue-bg);border-radius:30px;padding:3cqmin 8cqmin;display:flex;flex-direction:column;align-items:center;gap:1cqmin;box-shadow:0 4px 0 #BCD4F5}
.introbig .e{font-size:min(30cqh,34cqw);line-height:1.05}
.introbig b{font:800 min(11cqh,10cqw)/1.1 var(--f-num);color:var(--purple)}
.btn.go{background:var(--orange);box-shadow:0 4px 0 #C25A1E;font-size:22px;padding:16px 30px}
.ynhelp{display:flex;gap:10px;font-weight:800;font-size:clamp(15px,4cqmin,20px)}
.ynhelp span{border-radius:14px;padding:4px 12px}
.ynhelp .y{background:var(--good-bg);color:var(--good)} .ynhelp .n{background:#FFE3E7;color:var(--bad)}
.keybig.yn .e{font-size:min(30cqh,40cqw)}
.keybig.ok{background:var(--good-bg);box-shadow:0 4px 0 #b5e7cc}
.ynb{display:flex;gap:6cqmin}
.ynb button{border:0;width:min(30cqw,22cqh);height:min(30cqw,22cqh);border-radius:50%;font:800 calc(min(30cqw,22cqh)*.5)/1 var(--f-body);color:#fff}
.ybtn{background:var(--good);box-shadow:0 5px 0 #16804C}
.nbtn{background:var(--bad);box-shadow:0 5px 0 #A8303F}
.ynb button:active{transform:translateY(4px);box-shadow:none}
.ynb button.ok{outline:6px solid var(--star)}
.ynb button.no{opacity:.6}
@container (orientation:landscape){.sbody.col:has(.introbig){flex-direction:row;flex-wrap:wrap}.introbig .e{font-size:min(40cqh,20cqw)}}
@container (orientation:landscape){.sbody.col:has(.ynb){flex-direction:row;flex-wrap:wrap}.ynb{flex-direction:column}}

/* tập viết / đường kẻ: dọc xếp một cột; ngang chia trái (lời dặn, nút) – phải (bảng viết) */
.split .side,.split .main{display:contents}
.split .board{order:4}.split .msg,.split .prog{order:5}.split #ctl{order:6}.split .steps{order:7}.split details{order:8}

@media (orientation:landscape) and (min-width:600px){
  .top .back,.top .pill{height:46px;min-width:46px;font-size:21px}
  .deck{flex-direction:row}
  .secs{flex-direction:column;overflow-x:hidden;overflow-y:auto;width:clamp(150px,22vw,230px);padding:2px 6px 2px 2px}
  .secs{gap:5px}
  .secs button{justify-content:flex-start;height:auto;min-height:42px;padding:4px 12px;width:100%}
  .secs .si{font-size:22px}
  .secs .sl{display:inline}
  .stage{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "pv sl nx"}
  .nav{align-self:center;width:66px;height:96px}
  .nav.next{width:76px}
  .wrap{max-width:1100px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 18px;height:calc(100dvh - 100px);min-height:300px}
  .split .side{display:flex;flex-direction:column;gap:10px;align-items:center;overflow-y:auto;max-height:100%;min-height:0;align-self:stretch}
  .split .main{display:flex;align-items:center;justify-content:center;height:100%;min-height:0}
  .split .pad{width:calc((100dvh - 150px)*100/146);height:calc(100dvh - 150px);max-height:560px;max-width:384px;min-height:200px}
  .split .board{height:100%;align-items:center}
  .split .mark{align-self:stretch}
}

.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(34,48,77,.45);z-index:20;padding:20px}
.win .box{background:var(--card);border-radius:30px;padding:24px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .35s}
.win .bigstar{font-size:84px;line-height:1;color:var(--star)}
.win h2{font-size:32px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.note{font-size:14px;color:var(--soft);font-weight:700;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

 i:{cao:2,s:[

   clouds:['ilkt','yimi']},
 t:{n:2,up:'T',key:['quả táo','🍎'],
   rhyme:['Chữ t cao hơn chữ i','Thêm gạch ngang nhỏ, nhớ ghi cho liền.'],

   vow:['i','a','o','ô','ơ','e','ê','y'],skip:['tõ','tỡ','tỹ','tọ','tẹ'],
   words:[['ti vi','📺'],['tò te','🎺'],['tô to','🥣'],['tí ti','🤏'],['tỉ tê','💬'],['tí tị','👶']],
   sents:[['Ti vi to.','📺'],['Tò te tò te.','🎺'],['Tô to tí ti.','🥣']],
   match:[['ti vi','📺'],['tò te','🎺'],['tô to','🥣'],['tí ti','🤏']],
   clouds:['tlđt','hitl']}
};
var TONES=[['ngang','',''],['huyền','̀','ˋ'],['sắc','́','ˊ'],['hỏi','̉','?'],['ngã','̃','~'],['nặng','̣','•']];
function tone(v,k){return (v+TONES[k][1]).normalize('NFC')}
function spk(s){return s.replace(/\bchữ t\b/g,'chữ tờ').replace(/\bchữ i\b/g,'chữ i')}

var view=document.getElementById('view'),backB=document.getElementById('back'),allA=document.getElementById('all');
function $(s,r){return (r||document).querySelector(s)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function base(c){return c.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC').toLowerCase()}
function hl(text,ch){return Array.from(text).map(function(c){return base(c)===ch?'<mark>'+c+'</mark>':c}).join('')}
function has(word,ch){return Array.from(word).some(function(c){return base(c)===ch})}
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- lưu trên máy ---------- */
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var stars=load('nhc-stars',0),sound=load('nhc-snd',true),done=load('nhc-done',{}),vdone=load('nhc-vdone',{});
function showStars(){$('#stars').textContent=stars}
function addStar(){stars++;save('nhc-stars',stars);showStars()}
var sndB=$('#snd');
function showSnd(){sndB.setAttribute('aria-pressed',sound?'true':'false');sndB.textContent=sound?'🔊':'🔇'}
sndB.onclick=function(){sound=!sound;save('nhc-snd',sound);showSnd();if(!sound&&window.NTH)NTH.stop();else say('Đọc to')};
/* 22/11: đọc chậm như cô giáo; giọng đọc nghe “bé” thành “bố” → khi nói gọi bé là “con” (hoặc tên bé khi đầu câu tự thêm) */
function say(t,cb){if(!sound){if(cb)setTimeout(cb,600);return}
  t=String(t).replace(/(^|[^\p{L}])([Bb])é(?!\p{L})/gu,function(m,a,b){return a+(b==='B'?'Con':'con')});
  NTH.say(t,{rate:.72,pitch:1.05,done:cb})}

/* ---------- chúc mừng ---------- */
var PRAISE=['Giỏi quá!','Tuyệt vời!',NTH.ten(1)+' giỏi lắm!','Giỏi quá, '+NTH.ten()+' ơi!','Đúng rồi, siêu ghê!'];

  document.body.appendChild(d);

  $('#wHome',d).onclick=function(){d.remove();go('')};

/* ---------- vẽ ô li ---------- */
function gridSVG(nums){
  var h='';[25,50,75].forEach(function(x){h+='<line x1="'+x+'" y1="4" x2="'+x+'" y2="142" stroke="#E3EAF6" stroke-dasharray="2 3"/>'});
  for(var k=1;k<=5;k++){var y=LI[k],bold=k===1||k===5;
    h+='<line x1="4" y1="'+y+'" x2="96" y2="'+y+'" stroke="'+(bold?'#9FB4DA':'#C9D7EE')+'" stroke-width="'+(bold?1.4:1)+'"/>';
    if(nums)h+='<text x="9" y="'+(y-2.5)+'" font-size="8" font-weight="800" fill="#9FB4DA" text-anchor="middle" font-family="Nunito,sans-serif">'+k+'</text>'}
  return h;
}
function gridCanvas(ctx){
  ctx.lineWidth=1;ctx.strokeStyle='#E3EAF6';ctx.setLineDash([2,3]);
  [25,50,75].forEach(function(x){ctx.beginPath();ctx.moveTo(x,4);ctx.lineTo(x,142);ctx.stroke()});ctx.setLineDash([]);
  ctx.font='800 8px Nunito,sans-serif';ctx.textAlign='center';
  for(var k=1;k<=5;k++){var y=LI[k],bold=k===1||k===5;ctx.strokeStyle=bold?'#9FB4DA':'#C9D7EE';ctx.lineWidth=bold?1.4:1;
    ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(96,y);ctx.stroke();ctx.fillStyle='#9FB4DA';ctx.fillText(k,9,y-2.5)}

function letterSVG(ch,cls){
  return '<svg viewBox="22 38 58 96" class="'+(cls||'')+'" aria-hidden="true">'+
    [50,75,100,125].map(function(y){return '<line x1="22" y1="'+y+'" x2="80" y2="'+y+'" stroke="#E0B9B9" stroke-width="1"/>'}).join('')+
    WR[ch].s.map(function(s){return '<path d="'+s[0]+'" stroke="#E03A3A" stroke-width="'+(s[2]?7:5)+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}).join('')+'</svg>';

/* ---------- đo nét ---------- */
var meas=document.getElementById('measure');
function samplePath(d,n){
  var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);meas.appendChild(p);
  var L=p.getTotalLength(),out=[];for(var i=0;i<=n;i++){var q=p.getPointAtLength(L*i/n);out.push([q.x,q.y])}
  meas.removeChild(p);return {pts:out,len:L};
}
var SM={};
function stepSamples(ch,k){var key=ch+'_'+k;if(!SM[key])SM[key]=samplePath(WR[ch].s[k][0],WR[ch].s[k][2]?4:30);return SM[key]}
function nearest(S,p){var bi=0,bd=1e9;for(var i=0;i<S.length;i++){var dx=S[i][0]-p[0],dy=S[i][1]-p[1],d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return [bi,Math.sqrt(bd)]}
function judge(S,P){
  if(P.length<4)return {short:1};
  var near=0,idx=[];P.forEach(function(p){var r=nearest(S,p);idx.push(r[0]);if(r[1]<13)near++});
  var cov=0;S.forEach(function(s){if(P.some(function(p){var dx=p[0]-s[0],dy=p[1]-s[1];return dx*dx+dy*dy<11*11}))cov++});
  var q=Math.max(1,Math.floor(P.length/4)),a=0,b=0;
  for(var i=0;i<q;i++){a+=idx[i];b+=idx[P.length-1-i]}a/=q;b/=q;
  var d0=Math.hypot(P[0][0]-S[0][0],P[0][1]-S[0][1]),d1=Math.hypot(P[0][0]-S[S.length-1][0],P[0][1]-S[S.length-1][1]);
  return {near:near/P.length,cov:cov/S.length,rev:(b<a-3)||(d1<14&&d0>18&&b<a)};
}
function arrowAt(ctx,d,f,col){
  var s=samplePath(d,40),i=Math.min(39,Math.round(f*40)),p=s.pts[i],q=s.pts[i+1],a=Math.atan2(q[1]-p[1],q[0]-p[0]);
  ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(a);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-3,-4);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();ctx.restore();
}

function home(){
  view.innerHTML='<div class="wrap"><section class="hero"><div class="ab" aria-hidden="true"><span class="r">i</span><span class="r">t</span></div>'+
  '<h1>'+NTH.ten(1)+' ơi, mình học chữ theo vở nhé!</h1><p class="sub">Bài 1 chữ i, bài 2 chữ tờ. Học đọc rồi tập viết trên ô li.</p></section>'+

function momHome(){
  return '<p>Các bài ở đây đi theo <b>vở bé đang học</b> (Bài 1: i, Bài 2: t). Mỗi bài giống trang vở: nhận biết chữ (in thường, in hoa, viết thường, viết hoa), tìm tranh có chữ, luyện đọc với 6 dấu thanh, tìm chữ trong đám mây; bài t có thêm đọc từ, đọc câu và nối từ với tranh. Từ, câu và vần thơ trong app do Nari tự viết, mẹ dùng song song với vở.</p>'+
  '<h2>Ô li và đường kẻ</h2><ul>'+
  '<li>Đường kẻ đếm <b>từ dưới lên</b>: đường kẻ 1 là dòng đậm dưới cùng, rồi 2, 3, 4, 5. Mỗi khoảng giữa hai đường kẻ là 1 ô li.</li>'+
  '<li>Chơi “Đường kẻ” trước để bé quen nghe “đặt bút ở đường kẻ 2”. Trên vở thật, mẹ chấm một chấm đỏ nhỏ ở chỗ đặt bút như vở mẫu.</li>'+
  '<li>Chữ <b>i</b> cao 2 ô li, chữ <b>t</b> cao 3 ô li.</li></ul>'+
  '<h2>Cách viết chữ i</h2><ol>'+WR.i.mom.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+
  '<h2>Cách viết chữ t</h2><ol>'+WR.t.mom.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+
  '<h2>Gợi ý cho mẹ</h2><ul>'+
  '<li>Đọc theo âm: chữ t đọc là “tờ”. Đánh vần “tờ – a – ta – huyền – tà”.</li>'+
  '<li>Ngồi thẳng lưng, mắt cách vở khoảng một gang tay. Cầm bút bằng 3 ngón (cái, trỏ, giữa), không cầm sát ngòi.</li>'+
  '<li>Mỗi lần chỉ viết vài chữ cho đúng nét, đúng chiều. Viết ít mà đẹp tốt hơn viết nhiều mà vội.</li>'+
  '<li>Bé hay viết móc của i, t quay sang trái (như chữ j). Nhắc bé: “móc quay về phía ngôi nhà”, dán hình ngôi nhà nhỏ ở mép phải vở.</li>'+

/* ---------- bài đọc: trình chiếu, mỗi trang một việc nhỏ ----------
   22/11 mẹ: chuyển trang chậm lại, cô nói như cô giáo ngồi cạnh (giới thiệu từng phần rõ ràng), đánh vần khi đọc tranh,
   Tìm tranh = mỗi trang 1 tranh, bé bấm ✔ (có chữ) / ✖ (không có). Dọc: biểu tượng các phần ở trên; ngang: menu bên trái. */
var SEC=[['nhan','👀','Nhận biết'],['tranh','🖼️','Tìm tranh'],['doc','📖','Luyện đọc'],['tu','🔤','Đọc từ'],['noi','🔗','Nối'],['may','☁️','Đám mây'],['xong','⭐','Xong bài']];

function intro(sec,ch,num,last){
  var sn=SND[ch],X=LES[ch],h=(num===1&&NTH.name()?NTH.name()+' ơi, ':'')+'Phần '+(last?'cuối':SO[num-1])+': '+SEC.filter(function(s){return s[0]===sec})[0][2]+'. ';
  return h+({
    nhan:'Hôm nay cô và con học chữ '+sn+'. Cô cho con xem chữ '+sn+' viết theo bốn cách. Con nhìn thật kỹ, nghe cô đọc, rồi đọc theo cô nhé. Xem xong trang nào, con bấm nút mũi tên màu cam để sang trang.',
    tranh:'Sau đây cô đưa ra các bức tranh. Cô đọc to tên bức tranh và đánh vần cho con nghe. Tranh nào có chữ '+sn+', con bấm nút đúng màu xanh. Tranh nào không có chữ '+sn+', con bấm nút sai màu đỏ nhé.',
    doc:X.vow?'Chữ tờ ghép với các chữ khác thành tiếng mới. Ví dụ: tờ, a, ta. Mỗi trang cô cho con một tiếng, và sáu dấu thanh. Con chạm vào từng ô, nghe cô đánh vần, rồi đọc to theo cô nhé.'
      :'Chữ i đi với các dấu thanh sẽ đọc khác nhau. Con chạm vào từng ô, nghe cô đọc, rồi con đọc to theo cô nhé.',
    tu:'Cô đọc từng từ, đánh vần thật chậm. Con nghe, rồi đọc to theo cô nhé. Con chạm vào bức tranh để nghe lại.',
    noi:'Cô đọc một từ. Con tìm bức tranh đúng với từ đó, rồi chạm vào bức tranh nhé.',

function slidesOf(ch){
  var X=LES[ch],S=[];
  [['g',ch,'in thường'],['g',X.up,'in hoa'],['svg',ch,'viết thường'],['h',X.up,'viết hoa']].forEach(function(f){S.push({sec:'nhan',t:'form',f:f})});
  S.push({sec:'nhan',t:'key'},{sec:'nhan',t:'rhyme'});
  shuffle(X.yes.map(function(p){return [p,1]}).concat(X.no.map(function(p){return [p,0]}))).forEach(function(p){S.push({sec:'tranh',t:'yn',p:p[0],has:p[1]})});
  (X.vow||[ch]).forEach(function(v){S.push({sec:'doc',t:'tones',v:v})});
  if(X.words){X.words.forEach(function(w){S.push({sec:'tu',t:'word',w:w})});X.sents.forEach(function(s){S.push({sec:'tu',t:'sent',s:s})})}
  if(X.match)X.match.forEach(function(m,i){var o=shuffle(X.match.map(function(x,j){return j}).filter(function(j){return j!==i})).slice(0,2);S.push({sec:'noi',t:'match',i:i,o:shuffle(o.concat([i]))})});
  X.clouds.forEach(function(c){S.push({sec:'may',t:'cloud',c:shuffle(Array.from(c))})});
  /* trang giới thiệu đầu mỗi phần */
  var out=[],seen={},secs=[];S.forEach(function(s){if(!seen[s.sec]){seen[s.sec]=1;secs.push(s.sec)}});
  seen={};S.forEach(function(s){if(!seen[s.sec]){seen[s.sec]=1;var n=secs.indexOf(s.sec)+1;out.push({sec:s.sec,t:'intro',n:n,last:n===secs.length})}out.push(s)});

function cap(w){return w.charAt(0).toUpperCase()+w.slice(1)}
/* đánh vần như cô giáo: “tờ, i, ti” · “bờ, ut, but, sắc, bút” · “quờ, a, qua, hỏi, quả” */
var ONS=['ngh','ng','gh','gi','kh','ch','nh','ph','th','tr','qu','b','c','d','đ','g','h','k','l','m','n','p','r','s','t','v','x'];
var OSND={ngh:'ngờ',ng:'ngờ',gh:'gờ',gi:'di',kh:'khờ',ch:'chờ',nh:'nhờ',ph:'phờ',th:'thờ',tr:'trờ',qu:'quờ',b:'bờ',c:'cờ',d:'dờ','đ':'đờ',g:'gờ',h:'hờ',k:'ca',l:'lờ',m:'mờ',n:'nờ',p:'pờ',r:'rờ',s:'sờ',t:'tờ',v:'vờ',x:'xờ'};
function spellSyl(s){
  s=s.replace(/[.,!?]/g,'').toLowerCase();
  var d=s.normalize('NFD'),m=d.match(/[̣̀́̃̉]/),k=0;
  if(m)k=TONES.findIndex(function(t){return t[1]===m[0]});
  var plain=d.replace(/[̣̀́̃̉]/g,'').normalize('NFC'),on='';
  for(var i=0;i<ONS.length;i++)if(plain.indexOf(ONS[i])===0&&plain.length>ONS[i].length){on=ONS[i];break}
  var van=plain.slice(on.length),vs=van==='y'?'i':van,out=on?[OSND[on],vs,plain]:[vs];
  if(k)out.push(TONES[k][0],s);
  return out.join(', ');
}
function spellWord(w){return w.split(' ').map(spellSyl).join('. ')}

/* ---------- Đường kẻ: chạm vào đường kẻ cô gọi ---------- */
function lines(){
  var Q=shuffle([1,2,3,4,5]).concat(shuffle([1,2,3,4,5]).slice(0,3)),i=0,miss=0;

      '<p class="ask">Đường kẻ số <span class="r" style="font-size:1.5em">'+n+'</span></p>'+

    kidEars();
    say('Bé chạm vào đường kẻ số '+n+'.'+(show?'':' Bé đếm từ dưới lên nhé.'));

      if(best===n){say('Đúng rồi! Đường kẻ '+n+'.');i++;setTimeout(function(){if(i<Q.length)round();else{done.dk=1;save('nhc-done',done);
        win('Bé tìm đúng '+Q.length+' đường kẻ'+(miss?'':' mà không sai lần nào')+'.',lines)}},1100)}
      else{miss++;shakeEl(pad);say('Đây là đường kẻ '+best+'. Bé tìm đường kẻ '+n+' nhé.')}

  }

function letter(ch){

  '<div class="row" id="ctl"></div>'+
  '<ol class="steps" id="steps"></ol>'+
  '<details class="mom"><summary>👩 Dành cho mẹ: cách viết chữ '+ch+' ›</summary><ol>'+X.mom.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+
  '<p class="hint" style="margin-top:8px">Số 1, 2, 3, 4, 5 bên trái bảng là số đường kẻ, đếm từ dưới lên. Bé viết ngón tay trên màn hình trước, rồi viết bút chì vào vở.</p></details></div>'+
  '<div class="main"><div class="board"><div class="mark l"><i>🌳</i>cây</div><div id="padBox" style="display:contents"></div><div class="mark r"><i>🏠</i>nhà</div></div></div></section>';
  view.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===mode?'true':'false');b.onclick=function(){mode=b.dataset.m;letter(ch);kidEars()}});
  ({xem:watch,to:trace,tu:free})[mode](ch);
}
function stepList(ch,cur,doneUpTo,clickable){
  $('#steps').innerHTML=WR[ch].s.map(function(s,i){
    var c=i===cur?'cur':(i<doneUpTo?'done':'');
    var inner='<b>'+(i<doneUpTo&&i!==cur?'✓':i+1)+'</b><span>'+s[1]+'</span>';
    return '<li class="'+c+'">'+(clickable?'<button data-k="'+i+'">'+inner+'</button>':inner)+'</li>';
  }).join('');
}
function setMsg(t,cls){var m=$('#msg');m.textContent=t||' ';m.className='msg'+(cls?' '+cls:'')}

/* ① xem cô viết: nét chạy từng bước, số thứ tự nét ở chỗ đặt bút */
function watch(ch){
  var X=WR[ch];
  $('#padBox').outerHTML='<svg class="pad" id="pad" viewBox="0 0 100 146" role="img" aria-label="Cách viết chữ '+ch+'">'+gridSVG(true)+
    X.s.map(function(s){return '<path d="'+s[0]+'" stroke="#E4EAF5" stroke-width="'+(s[2]?8:7)+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}).join('')+
    X.s.map(function(s,i){return '<path class="st" data-k="'+i+'" d="'+s[0]+'" stroke="'+INK+'" stroke-width="'+(s[2]?8:6)+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}).join('')+
    X.s.map(function(s,i){var p=samplePath(s[0],1).pts[0],dx=s[2]?8:(i===2?-7:-7);return '<text x="'+(p[0]+dx)+'" y="'+(p[1]+(s[2]?2:3))+'" font-size="8" font-weight="800" fill="#E03A3A" text-anchor="middle" font-family="Nunito,sans-serif">'+(i+1)+'</text>'}).join('')+
    '<circle id="pen" r="4.5" fill="'+PEN+'" stroke="#fff" stroke-width="1.5" cx="'+samplePath(X.s[0][0],1).pts[0][0]+'" cy="'+samplePath(X.s[0][0],1).pts[0][1]+'"/></svg>';
  $('#ctl').innerHTML='<button class="btn" id="play">▶ Xem cô viết</button><button class="btn light" id="goTo">Bé tô thử ›</button>';
  stepList(ch,-1,0,true);
  var paths=[].slice.call(document.querySelectorAll('#pad .st')),pen=$('#pen'),timer=null,token=0;
  paths.forEach(function(p){var L=p.getTotalLength()+.01;p.style.strokeDasharray=L;p.style.strokeDashoffset=L});
  function animStep(k,cb,my){
    var p=paths[k],L=p.getTotalLength()+.01,t0=null,dur=RM?1:Math.max(X.s[k][2]?500:1400,L*30);
    stepList(ch,k,k,true);setMsg('Nét '+(k+1));say(X.s[k][1]);
    function f(ts){if(my!==token||!pen.isConnected)return;if(t0===null)t0=ts;var t=Math.min(1,(ts-t0)/dur);
      p.style.strokeDashoffset=L*(1-t);var q=p.getPointAtLength((L-.01)*t);pen.setAttribute('cx',q.x);pen.setAttribute('cy',q.y);
      if(t<1)requestAnimationFrame(f);else timer=setTimeout(function(){if(my===token&&pen.isConnected)cb&&cb()},RM?300:2600)}
    requestAnimationFrame(f);
  }
  function playFrom(k,only){
    var my=++token;clearTimeout(timer);
    paths.forEach(function(p,i){var L=p.getTotalLength()+.01;p.style.strokeDashoffset=i<k?0:L});
    (function run(i){if(i>=paths.length||(only&&i>k)){stepList(ch,-1,paths.length,true);setMsg('Bé thấy chưa? Giờ bé tô thử nhé!','good');paths.forEach(function(p){p.style.strokeDashoffset=0});return}
      animStep(i,function(){run(i+1)},my)})(k);
  }
  $('#play').onclick=function(){playFrom(0)};
  $('#goTo').onclick=function(){mode='to';letter(ch);kidEars()};
  $('#steps').addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(b)playFrom(+b.dataset.k,true)});
  setTimeout(function(){if(document.body.contains(pen))playFrom(0)},400);
}

function makePad(onUp){
  $('#padBox').outerHTML='<canvas class="pad" id="pad" aria-label="Bảng viết ô li"></canvas>';
  var cv=$('#pad'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,sc=1,strokes=[],cur=null,painter=function(){};
  function size(){var r=cv.getBoundingClientRect();if(!r.width)return;cv.width=r.width*dpr;cv.height=r.height*dpr;sc=r.width/W;draw()}
  function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(sc,sc);ctx.lineCap='round';ctx.lineJoin='round';
    gridCanvas(ctx);painter(ctx);
    ctx.strokeStyle=PEN;ctx.lineWidth=5;
    strokes.forEach(function(st){ctx.beginPath();ctx.moveTo(st[0][0],st[0][1]);st.forEach(function(p){ctx.lineTo(p[0],p[1])});if(st.length===1)ctx.lineTo(st[0][0]+.1,st[0][1]);ctx.stroke()});
    ctx.restore()}
  function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/sc,(e.clientY-r.top)/sc]}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pos(e)];strokes.push(cur);draw()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;cur.push(pos(e));draw()});
  function up(){if(!cur)return;cur=null;onUp&&onUp()}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  requestAnimationFrame(size);if(window.ResizeObserver)new ResizeObserver(function(){if(document.body.contains(cv))size()}).observe(cv);
  return {draw:draw,setPainter:function(f){painter=f;draw()},strokes:function(){return strokes},clear:function(){strokes=[];draw()},cv:cv};
}

/* ② tô từng nét: chỉ hiện nét đang làm; chấm xanh = đặt bút, vòng đỏ = dừng bút; kiểm tra chiều đi */
function trace(ch){
  var X=WR[ch],k=0,rev=0,pad;
  $('#ctl').innerHTML='<button class="btn light" id="again">Tô lại nét này</button><button class="btn light" id="restart">Làm lại từ đầu</button>';
  function paint(ctx){
    X.s.forEach(function(s,i){var p=new Path2D(s[0]);
      if(i<k){ctx.strokeStyle=INK;ctx.lineWidth=s[2]?7:5.5;ctx.stroke(p)}
      else if(i>k){ctx.strokeStyle='#EEF2F9';ctx.lineWidth=7;ctx.stroke(p)}});
    if(k<X.s.length){var s=X.s[k],p=new Path2D(s[0]),S=stepSamples(ch,k).pts;
      if(s[2]){ctx.fillStyle='#D8E4F6';ctx.beginPath();ctx.arc(S[2][0],S[2][1],8,0,7);ctx.fill();ctx.fillStyle='#22A866';ctx.beginPath();ctx.arc(S[2][0],S[2][1],4,0,7);ctx.fill();return}
      ctx.strokeStyle='#D8E4F6';ctx.lineWidth=13;ctx.stroke(p);
      ctx.setLineDash([2,3]);ctx.strokeStyle='#7F95BD';ctx.lineWidth=1.3;ctx.stroke(p);ctx.setLineDash([]);
      arrowAt(ctx,s[0],.45,'#7F95BD');
      var e=S[S.length-1];ctx.strokeStyle='#E04A5F';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(e[0],e[1],4,0,7);ctx.stroke();
      ctx.fillStyle='#22A866';ctx.beginPath();ctx.arc(S[0][0],S[0][1],4.5,0,7);ctx.fill();}
  }
  function startStep(){pad.clear();pad.setPainter(paint);stepList(ch,k,k,false);setMsg('Nét '+(k+1)+': đặt bút ở chấm xanh');say(X.s[k][1])}
  function ok(){
    k++;
    if(k>=X.s.length){pad.clear();pad.setPainter(paint);stepList(ch,-1,k,false);setMsg('Xong chữ '+ch+'!','good');if(!vdone[ch]){vdone[ch]=1;save('nhc-vdone',vdone)}
      win('Bé tô đủ '+X.s.length+' nét của chữ '+ch+(rev?'. Lần sau nhớ bắt đầu ở chấm xanh nhé.':', đúng chiều hết!'),function(){mode='tu';letter(ch);kidEars()},'Bé tự viết ›');return}
    setMsg('Đúng rồi! Sang nét '+(k+1)+'.','good');setTimeout(startStep,700);
  }
  pad=makePad(function(){
    var P=[].concat.apply([],pad.strokes());
    if(X.s[k][2]){var c=stepSamples(ch,k).pts[2];
      if(P.some(function(p){return Math.hypot(p[0]-c[0],p[1]-c[1])<9})){ok();return}
      pad.clear();setMsg('Bé chấm vào chấm xanh nhé.','bad');say('Bé chấm vào chấm xanh nhé.');shakeEl(pad.cv);return}
    var r=judge(stepSamples(ch,k).pts,P);
    if(r.short)return;
    if(r.rev&&r.cov>.25){rev++;pad.clear();setMsg('Ồ, bé đi ngược chiều rồi. Bắt đầu ở chấm xanh, đi theo mũi tên nhé.','bad');say('Ồ, bé đi ngược chiều rồi. Mình bắt đầu ở chấm xanh nhé.');shakeEl(pad.cv);return}
    if(r.near<.6){pad.clear();setMsg('Bé đi theo đường chấm nhé.','bad');say('Bé đi theo đường chấm nhé.');shakeEl(pad.cv);return}
    if(r.cov>=.8){ok();return}
    setMsg('Bé tô tiếp tới vòng đỏ cuối đường nhé.');
  });
  $('#again').onclick=function(){startStep()};
  $('#restart').onclick=function(){k=0;rev=0;startStep()};
  startStep();
}

/* ③ tự viết: chỉ có ô li; so với mẫu và với mẫu lật gương (móc quay sai phía) */
function free(ch){
  var X=WR[ch],sn=SND[ch],ghost=false,pad;
  $('#ctl').innerHTML='<button class="btn light" id="clr">Xóa</button><button class="btn light" id="gh">Hiện mẫu mờ</button><button class="btn" id="chk">Bé viết xong ★</button>';
  stepList(ch,-1,0,false);
  setMsg('Bé tự viết chữ '+ch+' cao '+X.cao+' ô li.');say('Bé tự viết chữ '+sn+' nhé. Chữ '+sn+' cao '+X.cao+' ô li.');
  function paint(ctx){if(!ghost)return;ctx.strokeStyle='#E4EAF5';X.s.forEach(function(s){ctx.lineWidth=s[2]?8:7;ctx.stroke(new Path2D(s[0]))})}
  pad=makePad(null);pad.setPainter(paint);
  $('#clr').onclick=function(){pad.clear();setMsg(' ')};
  $('#gh').onclick=function(){ghost=!ghost;this.textContent=ghost?'Ẩn mẫu':'Hiện mẫu mờ';pad.draw()};
  $('#chk').onclick=function(){
    var P=[].concat.apply([],pad.strokes());if(P.length<6){setMsg('Bé viết chữ '+ch+' vào bảng trước nhé.');return}
    var all=[],mir=[];X.s.forEach(function(s,i){if(s[2])return;stepSamples(ch,i).pts.forEach(function(p){all.push(p);mir.push([W-p[0]+(p[0]>=50?0:0),p[1]])})});
    function cover(S,r){var c=0;S.forEach(function(s){if(P.some(function(p){var dx=p[0]-s[0],dy=p[1]-s[1];return dx*dx+dy*dy<r*r}))c++});return c/S.length}
    var c=cover(all,11),c2=cover(all,6),m2=cover(mir,6);
    var dot=X.s.filter(function(s){return s[2]})[0],dotOk=true;
    if(dot){var dc=samplePath(dot[0],2).pts[1];dotOk=pad.strokes().some(function(st){var xs=st.map(function(q){return q[0]}),ys=st.map(function(q){return q[1]});return Math.max(Math.max.apply(0,xs)-Math.min.apply(0,xs),Math.max.apply(0,ys)-Math.min.apply(0,ys))<9&&st.some(function(p){return Math.hypot(p[0]-dc[0],p[1]-dc[1])<12})})}
    if(m2>.45&&m2>c2+.12){ghost=true;$('#gh').textContent='Ẩn mẫu';pad.draw();
      setMsg('Hình như cái móc bị quay ngược rồi! Móc quay về phía ngôi nhà nhé.','bad');say('Hình như cái móc bị quay ngược rồi. Móc quay về phía ngôi nhà nhé.');shakeEl(pad.cv);return}
    if(c>=.7&&!dotOk){setMsg('Gần xong rồi! Chữ i còn thiếu dấu chấm trên đầu.','bad');say('Gần xong rồi. Chữ i còn thiếu dấu chấm trên đầu.');return}
    if(c>=.7){vdone[ch]=2;save('nhc-vdone',vdone);win('Bé tự viết chữ '+ch+' đúng rồi!',function(){pad.clear();setMsg('Bé viết thêm một chữ '+ch+' nữa nhé.')},'Viết thêm');return}
    ghost=true;$('#gh').textContent='Ẩn mẫu';pad.draw();setMsg('Bé so với mẫu mờ, rồi viết lại nhé.','bad');say('Bé so với mẫu, rồi viết lại nhé.');
  };
}

/* ---------- chuyển trang + app cho bé ---------- */
function go(h){if(location.hash.slice(1)===h)render();else location.hash=h}
function kidTiles(){
  view.querySelectorAll('.menu .tile').forEach(function(b){
    var h=b.dataset.go,name=b.dataset.say||(b.querySelector('h3')||b).textContent;
    b.onclick=function(){b.classList.add('go');say(name);setTimeout(function(){b.classList.remove('go');go(h)},sound?950:120)};
  });
}
function kidHello(){
  var hr=view.querySelector('.hero');if(!hr||hr.querySelector('.hello'))return;
  var h1=hr.querySelector('h1'),sub=hr.querySelector('.sub'),t=(h1?h1.textContent:'')+' '+(sub?sub.textContent:'');
  var b=document.createElement('button');b.type='button';b.className='hello';b.textContent='🔊';b.setAttribute('aria-label','Nghe cô nói');
  b.onclick=function(){say(t)};(h1||hr.lastChild).insertAdjacentElement('afterend',b);
}
function kidEars(){kidHello();
  view.querySelectorAll('.panel>h2, .panel>h1, .side>h2').forEach(function(h){
    if(h.querySelector('.ear'))return;
    var t=h.dataset.say||h.textContent,n=h.nextElementSibling;
    while(n&&n.classList.contains('stepper'))n=n.nextElementSibling;
    var x=(n&&/hint|ask/.test(n.className))?n.textContent:'';
    var e=document.createElement('button');e.type='button';e.className='ear';e.textContent='🔊';e.setAttribute('aria-label','Nghe');
    e.onclick=function(){say(spk(t+'. '+x))};h.appendChild(e);
  });
}
function render(){
  var h=location.hash.slice(1),mb=/^bai-([it])$/.exec(h),mv=/^viet-([it])$/.exec(h);
  if(window.NTH)NTH.stop();tok++;document.body.classList.remove('fit');
  var inner=!!(mb||mv||h==='duong-ke');backB.hidden=!inner;allA.hidden=inner;
  if(mb){DK=null;deck(mb[1])}else if(mv){mode='xem';letter(mv[1])}else if(h==='duong-ke')lines();else home();
  kidTiles();kidEars();
  window.scrollTo(0,0);
}
backB.onclick=function(){go('')};
window.addEventListener('hashchange',render);
showStars();showSnd();render();
})();
